name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  # Docker Hub image name. Defaults to "<docker-hub-username>/domain-scanner-web"
  # using the DOCKERHUB_USERNAME secret. Set the DOCKER_IMAGE repository
  # variable in GitHub (Settings -> Secrets and variables -> Actions ->
  # Variables) to override, e.g. "yourname/domain-scanner".
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE || format('{0}/domain-scanner-web', secrets.DOCKERHUB_USERNAME) }}

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Docker Hub repository if it does not exist
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          ns="${IMAGE_NAME%/*}"
          repo="${IMAGE_NAME#*/}"
          jwt="$(curl -fsSL -X POST https://hub.docker.com/v2/users/login/ \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            | jq -r .token)"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: JWT ${jwt}" \
            "https://hub.docker.com/v2/repositories/${ns}/${repo}/")"
          if [ "${code}" = "404" ]; then
            echo "Repository ${IMAGE_NAME} does not exist yet, creating it..."
            curl -fsSL -X POST https://hub.docker.com/v2/repositories/ \
              -H 'Content-Type: application/json' \
              -H "Authorization: JWT ${jwt}" \
              -d "{\"namespace\":\"${ns}\",\"name\":\"${repo}\",\"description\":\"Domain Scanner\",\"is_private\":false}"
            echo "Created ${IMAGE_NAME}"
          else
            echo "Repository ${IMAGE_NAME} already exists (HTTP ${code})"
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
          flavor: |
            # Always push :latest (docker-compose.yml pulls latest); every
            # push to main/master and every v* tag updates it.
            latest=true
          labels: |
            org.opencontainers.image.title=Domain Scanner
            org.opencontainers.image.description=Domain name availability checker with a built-in web UI
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
